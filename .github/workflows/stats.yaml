---
name: stats
on: [create, workflow_dispatch]
jobs:
  gen_stats:
    if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    steps:
      # Check out the main branch (not the tag): the stats commit must land
      # on a branch so `git push` works. fetch-depth 0 so all version tags
      # are present for the badge list.
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - run: ${{ github.workspace }}/.github/scripts/gen_stats.sh
      - name: Commit changes
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add STATS.md
          if ! git diff --cached --quiet; then
            git commit -m '[Bot] stats - Update STATS.md'
            git push
          fi
